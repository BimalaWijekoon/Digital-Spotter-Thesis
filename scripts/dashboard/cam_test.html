<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Spotter - Camera Test</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        h1 { margin: 0 0 10px 0; color: #10b981; }
        p { margin: 0; color: #94a3b8; }
        
        .video-container {
            width: 640px;
            max-width: 100%;
            aspect-ratio: 4/3;
            background: #1e293b;
            border: 2px solid #334155;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        
        #camFeed {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
        
        #errorOverlay {
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }
        
        .status {
            margin-top: 20px;
            padding: 10px 20px;
            border-radius: 8px;
            background: #1e293b;
            font-family: monospace;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Camera Feed Test</h1>
        <p>Raw MJPEG stream at 30 FPS</p>
    </div>

    <div class="video-container">
        <img id="camFeed" src="/video_feed" alt="Live Camera Feed" />
        
        <div id="errorOverlay" style="display: none;">
            <svg style="width: 48px; height: 48px; color: #ef4444; margin-bottom: 10px;" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
            <h3 style="margin: 0 0 10px 0; color: #ef4444;">Connection Lost</h3>
            <p style="color: #94a3b8; font-size: 14px;">The image feed disconnected or the server stopped sending frames.</p>
        </div>
    </div>

    <div class="status" id="statusBox">
        <span style="color: #10b981;">●</span> Streaming /video_feed...
    </div>

    <script>
        const camFeed = document.getElementById('camFeed');
        const errorOverlay = document.getElementById('errorOverlay');
        const statusBox = document.getElementById('statusBox');

        // Note: For MJPEG streams, the 'error' event usually fires if the server abruptly closes 
        // the connection, or if it returns a non-image content type.
        camFeed.onerror = function() {
            errorOverlay.style.display = 'flex';
            statusBox.innerHTML = '<span style="color: #ef4444;">●</span> Stream Failed / Disconnected';
        };

        // If it successfully loads an image packet
        camFeed.onload = function() {
            errorOverlay.style.display = 'none';
            statusBox.innerHTML = '<span style="color: #10b981;">●</span> Receiving Frames...';
        };
    </script>
</body>
</html>
